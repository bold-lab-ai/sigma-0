[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-0"
version = "0.1.0"
description = "Unified matching-engine, environment, base_model, and lob_pipeline refactor repository."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
model-zoo = [
    "jax>=0.9,<0.10",
    "flax>=0.12,<0.13",
    "optax>=0.2.6,<0.3",
    "orbax-checkpoint>=0.11,<0.12",
    "chex>=0.1",
    "numpy>=2",
    "scipy>=1.14",
    "pandas>=2",
    "torch>=2.4",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "zstandard>=0.23",
    "tensorstore>=0.1",
    "tqdm>=4",
    "wandb>=0.19",
]

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a JAX CUDA device",
]
