name: mamba3_smoke
package: base_model
entrypoint: run/base_model/train_base_model.py
model: mamba3
dataset: autoregressive_lob
legacy_batch: run/base_model/train_full_autoreg.batch
legacy_workdir: .
sbatch_nodes: 1
sbatch_time: 00:10:00
sbatch_job_name: sigma0-autoreg-smoke
env_MODEL_PRESET: 75m
env_ARCHITECTURE: mamba3
env_TOKEN_MODE: 26tok
env_CURTAIL_EPOCHS: 1
env_EPOCHS: 1
env_NO_AUTO_RESUME: 1
env_FORBID_RAW_NPYZST: 0
env_QUANT_ROOT: /lus/lfs1aip2/projects/public/s5e/quant_team/quant
# The legacy indexed loader groups files by the first relative path component.
# For smoke only, use the readable GOOG 2022 shard as that key and keep the
# sidecar in this repo so the shared data tree is not mutated.
env_TICKERS: 2022
env_DATA_ROOT: /lus/lfs1aip2/projects/public/s5e/quant_team/quant/GOOG2016TO2021
env_DATA_INDEX_JSON: /lus/lfs1aip2/projects/public/u6gb/sigma-0/configs/train/goog_2022_smoke_index.json
env_TRAIN_DATE_RANGE: 2022-01-03,2022-01-05
env_TEST_DATE_RANGE: 2022-01-06,2022-01-07
env_N_DATA_WORKERS: 1
env_CHECKPOINT_EVERY: 999999
env_WANDB_PROJECT: sigma0-smoke
env_WANDB_ENTITY: oxford-lob
env_WANDB_MODE: online
env_USE_WANDB: True
