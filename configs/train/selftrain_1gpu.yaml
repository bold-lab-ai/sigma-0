# sigma-0 self-train smoke: single GPU (1 node x 1 GPU), 30 steps, ckpt every 10.
# Architecture matches R1 Mamba3 78M exactly (params must equal 78,539,423).
name: selftrain_1gpu
package: base_model
entrypoint: run/base_model/train_base_model.py
model: mamba3
dataset: autoregressive_lob
legacy_batch: run/base_model/train_full_autoreg.batch
legacy_workdir: .
sbatch_nodes: 1
sbatch_time: 00:30:00
sbatch_job_name: sigma0-selftrain-1gpu
# Sub-node launch: 1 GPU + 1/4 node memory + 72 cores (one Grace superchip).
sbatch_extra_args: --gres=gpu:1 --mem=115000M --cpus-per-task=72
env_GPUS_PER_NODE: 1
env_MODEL_PRESET: 75m
env_ARCHITECTURE: mamba3
env_TOKEN_MODE: 26tok
env_OPT_CONFIG: muon
env_MUON_LR: 0.01
env_PER_GPU_BSZ: 4
env_CURTAIL_EPOCHS: 30
env_CHECKPOINT_EVERY: 10
env_EPOCHS: 1
env_NO_AUTO_RESUME: 1
env_FORBID_RAW_NPYZST: 0
env_QUANT_ROOT: /lus/lfs1aip2/projects/public/s5e/quant_team/quant
# 43-col orderbook shard (matches R1 training format + verified inference path).
env_TICKERS: b43
env_DATA_ROOT: /lus/lfs1aip2/projects/public/u6gb/sigma-0/data/selftrain_b43
env_TRAIN_DATE_RANGE: 2022-12-30,2022-12-30
# Empty on purpose: node_wrapper drops the flag, run_train sees None, no test split.
env_TEST_DATE_RANGE:
env_N_DATA_WORKERS: 4
env_CHECKPOINT_BASE_DIR: /lus/lfs1aip2/projects/public/u6gb/sigma-0/checkpoints_selftrain
env_WANDB_PROJECT: sigma0-selftrain
env_WANDB_ENTITY: oxford-lob
env_WANDB_MODE: online
env_USE_WANDB: True
