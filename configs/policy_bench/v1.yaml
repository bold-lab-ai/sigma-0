# Policy bench v1: everything except the policy is fixed here.
# run/post_training/policy_bench/evaluate.py reads it. Paths are the team's shared copies.
name: policy_bench_v1
simulator: /projects/public/u6oz/model_zoo/nano-sigma/newtok_a_r1/ckpt.pt
signal: /projects/public/u6oz/model_zoo/nano-sigma/returnft_lobert_pass1/ckpt.pt
shards: /projects/public/u6oz/quant/lob_preproc_sp500_squashfs_v2_20261013
manifest: /projects/public/u6oz/quant/dataset_q4_2025_jan2026_v3/test.json
add_dir: /projects/public/u6oz/policy_bench/data/add_index
episodes: /projects/public/u6oz/policy_bench/data/dev_episodes_v1.json
month: 2026-01
history: 3968            # real rows before an episode (the signal's context)
n_messages: 1024         # background messages per episode
every: 64                # background messages between decisions
