# Policy bench v1: everything except the policy is fixed here.
# run/benchmarking/policy_bench/evaluate.py reads it. Paths are the team's shared copies.
name: policy_bench_v1
simulator: /projects/public/u6oz/model_zoo/nano-sigma/newtok_a_r1/ckpt.pt
signal: /projects/public/u6oz/model_zoo/nano-sigma/returnft_lobert_pass1/ckpt.pt
shards: /projects/public/u6oz/quant/lob_preproc_sp500_squashfs_v2_20261013
manifest: /projects/public/u6oz/quant/dataset_q4_2025_jan2026_v3/test.json   # the models' test month = the bench's train and dev
add_dir: /projects/public/u6oz/policy_bench/data/add_index
episodes: /projects/public/u6oz/policy_bench/data/dev_episodes_v1b.json
split: dev               # splits.SPLITS; evaluate checks every episode's date against it
month: 2026-01
history: 3968            # real rows before an episode (the signal's context)
n_messages: 1024         # background messages per episode
every: 64                # background messages between decisions
latency: 1               # background messages before an order is active
latency_ns: 100000000   # orders arrive 100 ms after the decision; replaces `latency` (results/latency)
max_rejections: 0        # every background draw masked to legal tokens (results/fills/v2, lobbench)
inventory_cap: 1000      # shares
order_size: 100          # shares, the baselines' order size
maker_rebate: 0.002      # $ per share
taker_fee: 0.003         # $ per share
batch: 48                # episodes decoded together on one GPU
terminals: [mark_to_mid, flatten_taker]
